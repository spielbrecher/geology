services:
  api:
    build: .
    command: sh -c "python bootstrap.py && uvicorn api:app --host 0.0.0.0 --port 8000"
    environment:
      - DB_PATH=/app/data/geological_data.db
    volumes:
      - ./data:/app/data          # SQLite — переживает пересоздание контейнеров
      - ./patterns:/app/patterns  # сканы штриховок (img:patterns/...)
      - ./output:/app/output      # сгенерированные PNG/PDF
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/',timeout=3)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build: .
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501 --server.headless=true
    environment:
      - API_URL=http://api:8000   # имя сервиса внутри сети compose
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped